<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Party Anywhere</title>
<!--
  Controle do celular (protocolo v1, ver crates/pa-phone/src/protocol.rs). Servido pelo Hub na rede local,
  sem internet (sem fontes nem scripts externos).

  Layouts: o Hub manda a lista ("Simples", "Avançado" e os criados na aba Controles). Cada layout tem um ou
  mais modos (ex.: A pé e Veículo) e cada modo, peças posicionadas numa tela de referência deitada de
  proporção CANVAS (ver apps/hub/src-tauri/src/settings.rs). Esta página encaixa essa tela na do celular:
  a altura encolhe junto e a largura só estica, então o que não se sobrepõe no editor não se sobrepõe aqui.
  Com mais de um modo, os nomes aparecem no topo e um toque troca. A pílula do topo (jogador, conexão, Menu)
  fica no meio, por cima da tela; os cantos ficam para os controles. Analógicos livres: o esquerdo nasce onde
  o dedo tocar na metade da tela dele, fora das outras peças (o direito, na outra metade).
  O menu abre segurando o botão do topo (evita abrir sem querer no meio do jogo).
  Cada mudança vai como STATE_T com o instante do toque, para o Hub medir a latência.
-->
<style>
:root {
  --bg: #0b0c0f;
  --panel: #15161a;
  --line: rgba(255, 255, 255, .1);
  --text: #f4f4f5;
  --muted: #9b9ca5;
  --neon: #3cf060;
  --seat: #3cf060;
  --a: #22c55e; --b: #ef4444; --x: #3b82f6; --y: #eab308;
  --u: 300px; /* altura da tela de referência, em px (render) */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; touch-action: none;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; }
/* a mesma barra de rolagem do Hub (menu) */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { min-height: 44px; border-radius: 999px; border: 3px solid transparent; background: rgba(255, 255, 255, .13) padding-box; }
::-webkit-scrollbar-button { display: none; height: 0; width: 0; }

.pad {
  position: fixed; inset: 0;
  background: radial-gradient(80% 60% at 50% 0%, color-mix(in srgb, var(--seat) 14%, transparent), transparent 70%), var(--bg);
}

/* pílula do topo, no meio: quem eu sou, modos, conexão, Menu (os cantos ficam para os controles) */
.pill {
  position: absolute; z-index: 5; top: max(6px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; padding: 4px; border-radius: 999px; max-width: 70vw;
  background: rgba(21, 22, 26, .88); border: 1px solid var(--line);
}
.pill .me { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-style: normal; font-weight: 900; font-size: 12px; background: var(--seat); color: rgba(0, 0, 0, .78); box-shadow: 0 0 12px var(--seat); }
.net { display: flex; align-items: center; gap: 5px; padding: 0 4px; font-size: 11px; font-weight: 800; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.net b { width: 7px; height: 7px; border-radius: 50%; background: var(--neon); }
.net.warn b { background: #facc15; } .net.bad b { background: #ef4444; }
/* menu: segurar ~0,5 s; o anel enche enquanto segura */
.menu-btn {
  position: relative; flex: none; height: 26px; padding: 0 10px 0 6px; border-radius: 999px;
  display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); background: rgba(255, 255, 255, .06);
}
.menu-btn .ring { width: 16px; height: 16px; border-radius: 50%; background: conic-gradient(var(--seat) calc(var(--p, 0) * 1turn), rgba(255, 255, 255, .18) 0); -webkit-mask: radial-gradient(circle, transparent 4px, #000 5px); mask: radial-gradient(circle, transparent 4px, #000 5px); }
.menu-btn.holding { color: var(--text); background: color-mix(in srgb, var(--seat) 20%, transparent); }

/* modos (A pé, Veículo...): um toque troca */
.modes { display: flex; gap: 2px; min-width: 0; overflow-x: auto; }
.modes:empty { display: none; }
.modes button { height: 26px; padding: 0 10px; border-radius: 999px; font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.modes button.on { background: color-mix(in srgb, var(--seat) 22%, transparent); color: var(--text); }

/* área do controle: cada peça na sua posição (render) */
.area { position: absolute; inset: env(safe-area-inset-top) max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left)); }
.area > * { position: absolute; z-index: 2; }
.area > .stick { z-index: 1; }
.sh { border-radius: calc(var(--u) * .04); background: var(--panel); border: 1px solid var(--line); font-weight: 800; font-size: calc(var(--u) * .05 * var(--s)); color: var(--muted); }
.small { border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: calc(var(--u) * .036 * var(--s)); font-weight: 800; color: var(--muted); }
/* analógico livre: a área toda é tocável; a dica (um círculo fraco) some no primeiro toque */
.stick .hint { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; border: 2px dashed rgba(255, 255, 255, .12); display: grid; place-items: center; font-size: 12px; line-height: 1.35; color: rgba(255, 255, 255, .3); text-align: center; pointer-events: none; transition: opacity .4s; }
.stick.used .hint { opacity: 0; }
.base, .knob { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
.base { border: 2px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .04); }
.knob { background: color-mix(in srgb, var(--seat) 70%, white 10%); box-shadow: 0 0 24px color-mix(in srgb, var(--seat) 60%, transparent); }
.dpad { display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 4%; }
.dpad button { border-radius: 22%; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: calc(var(--u) * .045 * var(--s)); font-weight: 900; }
.dpad [data-b="UP"] { grid-area: 1 / 2; }
.dpad [data-b="LEFT"] { grid-area: 2 / 1; }
.dpad [data-b="RIGHT"] { grid-area: 2 / 3; }
.dpad [data-b="DOWN"] { grid-area: 3 / 2; }
.fb {
  border-radius: 50%; font-size: calc(var(--u) * .08 * var(--s)); font-weight: 900;
  background: color-mix(in srgb, var(--c) 18%, var(--panel));
  border: 2px solid color-mix(in srgb, var(--c) 70%, transparent);
  color: var(--c);
}
.area button { display: grid; place-content: center; justify-items: center; gap: 2px; line-height: 1; }
.area button em { font-style: normal; font-weight: 700; font-size: calc(var(--u) * .038 * var(--s)); opacity: .9; max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb em { font-size: calc(var(--u) * .034 * var(--s)); }
.down { filter: brightness(1.6); transform: scale(.94); }
.fb.down { background: var(--c); color: rgba(0, 0, 0, .75); }
.sh.down, .small.down, .dpad .down { background: var(--seat); color: rgba(0, 0, 0, .78); }

/* camadas */
.layer { position: fixed; inset: 0; display: none; place-content: center; text-align: center; gap: 10px; padding: 24px; background: rgba(11, 12, 15, .94); z-index: 30; }
.layer.on { display: grid; }
.layer h2 { margin: 0; font-size: 20px; }
.layer p { margin: 0; color: var(--muted); font-size: 14px; }
.spinner { width: 36px; height: 36px; margin: 0 auto 6px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .15); border-top-color: var(--neon); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.rotate { display: none; }
@media (orientation: portrait) { .rotate { display: grid; } }

/* menu */
.sheet { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(6, 7, 9, .82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.sheet.on { display: block; }
.sheet .in {
  position: absolute; right: max(12px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); bottom: max(10px, env(safe-area-inset-bottom));
  width: min(420px, calc(100% - 24px)); overflow-y: auto; touch-action: pan-y;
  padding: 16px; border-radius: 22px; background: #15161a; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
}
.sheet h3 { margin: 16px 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sheet .top { display: flex; align-items: center; gap: 10px; }
.sheet .top b { font-size: 16px; }
.sheet .close { margin-left: auto; height: 34px; padding: 0 16px; border-radius: 999px; background: var(--seat); color: rgba(0, 0, 0, .8); font-weight: 800; font-size: 13px; }
.opt { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); text-align: left; margin-bottom: 8px; }
.opt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.opt .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
.opt.on { border-color: color-mix(in srgb, var(--seat) 70%, transparent); background: color-mix(in srgb, var(--seat) 10%, transparent); }
.opt.on .dot { border-color: var(--seat); background: radial-gradient(circle, var(--seat) 45%, transparent 50%); }
.opt .sw { margin-left: auto; width: 40px; height: 24px; border-radius: 12px; background: rgba(255, 255, 255, .15); position: relative; flex: none; }
.opt .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
.opt.on .sw { background: var(--seat); }
.opt.on .sw::after { transform: translateX(16px); }
.name-row { display: flex; gap: 8px; }
.name-row input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--text); font: inherit; font-size: 15px; user-select: text; -webkit-user-select: text; }
.name-row button { height: 42px; padding: 0 16px; border-radius: 12px; background: rgba(255, 255, 255, .08); font-weight: 800; font-size: 13px; }

/* diagnóstico (medição de latência), dentro do menu */
.rows { display: grid; grid-template-columns: auto 1fr 1fr 1fr auto; gap: 4px 10px; font-size: 13px; align-items: baseline; }
.rows .h { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.rows b { font-variant-numeric: tabular-nums; }
.go { height: 36px; padding: 0 16px; border-radius: 999px; background: rgba(255, 255, 255, .08); font-weight: 800; font-size: 12px; letter-spacing: .04em; margin-top: 10px; }
.go[disabled] { opacity: .5; }
#burstTxt { color: var(--muted); font-size: 12px; margin-left: 8px; }

/* Identificar: a tela inteira pisca na cor do jogador */
#flash { position: fixed; inset: 0; background: var(--seat, #3cf060); opacity: 0; pointer-events: none; z-index: 60; }
#flash.on { animation: flash 1s ease-out; }
@keyframes flash { 0%, 40% { opacity: .9; } 20%, 60% { opacity: .15; } 100% { opacity: 0; } }
/* interruptor escondido: no iPhone (Safari 18+), acioná-lo dá um toque de vibração */
#haptic { position: fixed; left: -100px; top: 0; width: 1px; height: 1px; opacity: 0; }
#toast { position: fixed; top: 14px; left: 50%; transform: translate(-50%, -140%); max-width: 80vw; padding: 10px 18px;
  border-radius: 999px; background: rgba(12, 16, 12, .92); color: #eef7e2; font: 600 14px system-ui, sans-serif;
  border: 1px solid rgba(60, 240, 96, .4); transition: transform .3s; z-index: 50; pointer-events: none; }
#toast.on { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="pad" id="pad">
  <div class="area" id="area"></div>
  <div class="pill">
    <i class="me" id="seatNum">·</i>
    <div class="modes" id="modes"></div>
    <div class="net" id="net"><b></b><span id="netTxt">--</span></div>
    <button class="menu-btn" id="menuBtn" aria-label="Menu (segure)"><span class="ring"></span>Menu</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="in">
    <div class="top"><i id="sheetSeat" style="width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;background:var(--seat);color:rgba(0,0,0,.78)">·</i><b id="seatName">Conectando...</b><button class="close" id="closeMenu">Voltar ao jogo</button></div>
    <h3>Controle</h3>
    <div id="layoutList"></div>
    <h3>Seu nome</h3>
    <form class="name-row" id="nameForm"><input id="nameInput" maxlength="20" autocomplete="off" placeholder="Como te chamam"><button>Salvar</button></form>
    <h3>Preferências</h3>
    <button class="opt" id="optVibe"><span><b>Vibrar ao tocar</b><small>Um toque leve a cada botão</small></span><span class="sw"></span></button>
    <button class="opt" id="optFs"><span><b>Tela cheia</b><small>Esconde as barras do navegador</small></span><span class="sw"></span></button>
    <h3>Diagnóstico</h3>
    <button class="opt" id="optDiag"><span><b>Medir a conexão</b><small>Atraso do toque até o PC</small></span><span class="sw"></span></button>
    <div id="diag" hidden>
      <div class="rows">
        <span class="h"></span><span class="h">p50</span><span class="h">p95</span><span class="h">p99</span><span class="h">amostras</span>
        <span>Toque → PC</span><b id="t50">--</b><b id="t95">--</b><b id="t99">--</b><b id="tn">0</b>
        <span>Rede</span><b id="r50">--</b><b id="r95">--</b><b id="r99">--</b><b id="rn">0</b>
        <span>Ida e volta</span><b id="i50">--</b><b id="i95">--</b><b id="i99">--</b><b id="in">0</b>
      </div>
      <button class="go" id="burstBtn">Medir a rede (30 s)</button><span id="burstTxt"></span>
    </div>
  </div>
</div>

<div class="layer" id="offline"><div class="spinner"></div><h2>Reconectando...</h2><p>O celular está no mesmo Wi-Fi do PC?</p></div>
<div class="layer" id="rejected"><h2 id="rejTitle">Não deu para entrar</h2><p id="rejText"></p></div>
<div class="layer rotate"><h2>Gire o celular</h2><p>O controle funciona deitado.</p></div>

<script>
'use strict';
const BIT = { A: 0, B: 1, X: 2, Y: 3, LB: 4, RB: 5, BACK: 6, START: 7, LS: 8, RS: 9, UP: 10, DOWN: 11, LEFT: 12, RIGHT: 13 };
const KIND = { heartbeat: 0, touch: 1, burst: 2, stick: 3 };
const HEARTBEAT_MS = 100;
const DEADZONE = 0.12;
const HOLD_MS = 500;
// tela de referência e tamanho base das peças (unidades da altura): os mesmos de settings.rs
const CANVAS = 2.17;
const SIZE = { stickL: [.5, .5], stickR: [.36, .36], dpad: [.36, .36], A: [.2, .2], B: [.2, .2], X: [.2, .2], Y: [.2, .2], LB: [.36, .14], RB: [.36, .14], LT: [.36, .14], RT: [.36, .14], BACK: [.2, .11], START: [.2, .11], LS: [.2, .11], RS: [.2, .11] };
// sem o Hub responder ainda: o Avançado
const P = (kind, xu, y, s = 1) => ({ kind, x: xu / CANVAS, y, s });
const FALLBACK = [{ id: 'advanced', name: 'Avançado', modes: [{ name: 'Padrão', pieces: [
  P('LT', .22, .1, 1.15), P('LB', .66, .1, 1.15), P('RB', 1.51, .1, 1.15), P('RT', 1.95, .1, 1.15), P('stickL', .3, .44), P('dpad', .76, .78, 1.1),
  P('BACK', 1.085, .33, 1.1), P('START', 1.085, .47, 1.1), P('LS', 1.085, .66, 1.1), P('RS', 1.085, .8, 1.1),
  P('Y', 1.6, .35, 1.25), P('X', 1.35, .6, 1.25), P('B', 1.85, .6, 1.25), P('A', 1.6, .85, 1.25), P('stickR', 1.98, .87, .7),
] }] }];
let U = 300; // altura da tela de referência, em px

const pad = { buttons: 0, lx: 0, ly: 0, rx: 0, ry: 0, lt: 0, rt: 0 };
let ws = null;
let seq = 0;
let lastSend = 0;
let syncId = 0;
const syncSent = new Map();
const rtts = [];
let syncTimer = null;
let burstTimer = null;
let stopped = false;
let layouts = FALLBACK;
let currentLayout = 'advanced';
let modeIdx = 0;
const prefs = { vibe: true };
try { Object.assign(prefs, JSON.parse(localStorage.getItem('pa.prefs') || '{}')); } catch (_) {}
try { const l = JSON.parse(localStorage.getItem('pa.layout') || 'null'); if (l && l.modes && l.modes.length) { layouts = [l]; currentLayout = l.id; } } catch (_) {}

const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- layout: peças posicionadas
const currentLayoutObj = () => layouts.find((l) => l.id === currentLayout) || layouts[0];
function render() {
  const layout = currentLayoutObj();
  if (modeIdx >= layout.modes.length) modeIdx = 0;
  releaseAll();
  const label = { BACK: 'VOLTAR', START: 'START', LS: 'L3', RS: 'R3' };
  const arrows = { UP: '▲', LEFT: '◀', RIGHT: '▶', DOWN: '▼' };
  $('area').innerHTML = layout.modes[modeIdx].pieces.filter((p) => SIZE[p.kind]).map((p, i) => {
    const k = p.kind, at = `data-i="${i}"`;
    if (k === 'stickL' || k === 'stickR') return `<div class="stick${prefs.stickSeen ? ' used' : ''}" ${at} data-stick="${k === 'stickL' ? 'l' : 'r'}"><div class="hint">Toque e<br>arraste</div></div>`;
    if (k === 'dpad') return `<div class="dpad" ${at}>${Object.keys(arrows).map((d) => `<button data-b="${d}">${arrows[d]}</button>`).join('')}</div>`;
    // nome da ação no jogo ("Pular", "Impulso"), quando o layout tem: embaixo da letra
    const name = p.label ? `<em>${escapeHtml(p.label)}</em>` : '';
    if ('ABXY'.includes(k) && k.length === 1) return `<button class="fb" ${at} data-b="${k}" style="--c:var(--${k.toLowerCase()})">${k}${name}</button>`;
    if (label[k]) return `<button class="small" ${at} data-b="${k}">${label[k]}${name}</button>`;
    return `<button class="sh" ${at} data-b="${k}">${k}${name}</button>`;
  }).join('');
  $('modes').innerHTML = layout.modes.length > 1 ? layout.modes.map((m, i) => `<button data-mode="${i}" class="${i === modeIdx ? 'on' : ''}">${escapeHtml(m.name)}</button>`).join('') : '';
  place();
  wire();
}

// Encaixa a tela de referência na área: altura u = a que couber; x espalha na largura toda (só afasta as
// peças, nunca aproxima). Chamado também ao girar ou mudar a barra do navegador, sem soltar nada.
function place() {
  const area = $('area');
  const W = area.clientWidth, H = area.clientHeight;
  if (!W || !H) return;
  const u = Math.min(H, W / CANVAS), top = (H - u) / 2;
  U = u;
  area.style.setProperty('--u', u + 'px');
  const pieces = currentLayoutObj().modes[modeIdx].pieces.filter((p) => SIZE[p.kind]);
  // analógico livre: a metade da tela em que ele está (se o outro analógico não está na mesma metade)
  const half = (p) => (p.x < 0.5 ? 'l' : 'r');
  const sticks = pieces.filter((p) => p.kind === 'stickL' || p.kind === 'stickR');
  const free = (p) => sticks.filter((q) => half(q) === half(p)).length === 1;
  area.querySelectorAll(':scope > [data-i]').forEach((el) => {
    const p = pieces[+el.dataset.i];
    const w = SIZE[p.kind][0] * p.s * u, h = SIZE[p.kind][1] * p.s * u;
    const cx = p.x * W, cy = top + p.y * u;
    if (el.classList.contains('stick') && free(p)) {
      const x0 = half(p) === 'l' ? 0 : W / 2;
      Object.assign(el.style, { left: x0 + 'px', top: '0px', width: W / 2 + 'px', height: H + 'px' });
      const hint = el.querySelector('.hint');
      Object.assign(hint.style, { left: cx - x0 + 'px', top: cy + 'px', width: Math.min(w, h) * 0.9 + 'px', height: Math.min(w, h) * 0.9 + 'px' });
      return;
    }
    el.style.left = cx - w / 2 + 'px';
    el.style.top = cy - h / 2 + 'px';
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.setProperty('--s', p.s);
    const hint = el.querySelector('.hint');
    if (hint) Object.assign(hint.style, { left: '50%', top: '50%', width: '90%', height: '90%' });
  });
}
// encaixa de novo sempre que a área muda de tamanho (girar, barra do navegador, primeira pintura)
if (window.ResizeObserver) new ResizeObserver(() => place()).observe($('area'));
else addEventListener('resize', () => setTimeout(place, 60));

// trocar de modo (a pé ↔ veículo): na hora, no toque
$('modes').addEventListener('pointerdown', (e) => {
  const b = e.target.closest('[data-mode]');
  if (!b) return;
  e.preventDefault();
  if (+b.dataset.mode === modeIdx) return;
  modeIdx = +b.dataset.mode;
  render();
  if (prefs.vibe) vibrate(15);
});

// ---------------------------------------------------------------- conexão
function deviceName() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua)) return 'iPad';
  const m = ua.match(/Android [\d.]+; ([^;)]+)/);
  if (m) return m[1].replace(/ Build.*/, '').trim();
  if (/Android/.test(ua)) return 'Android';
  return 'Navegador';
}

function connect() {
  if (stopped || document.hidden) return;
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    // o token guardado faz o Hub devolver a mesma vaga, mesmo reabrindo a página
    let token = null;
    try { token = localStorage.getItem('pa.token'); } catch (_) {}
    ws.send(JSON.stringify({ t: 'hello', v: 1, device: deviceName(), token }));
    $('offline').classList.remove('on');
    // rajada de sincronização para achar logo uma ida e volta curta; depois, uma a cada 2 s
    let n = 0;
    clearInterval(syncTimer);
    syncTimer = setInterval(() => {
      sendSync();
      if (++n === 12) { clearInterval(syncTimer); syncTimer = setInterval(sendSync, 2000); }
    }, 60);
  };
  ws.onmessage = (ev) => (typeof ev.data === 'string' ? onText(JSON.parse(ev.data)) : onBinary(new DataView(ev.data)));
  ws.onclose = () => {
    clearInterval(syncTimer);
    stopBurst();
    if (stopped) return;
    $('offline').classList.add('on');
    setTimeout(connect, 1000);
  };
}

function onText(m) {
  if (m.t === 'welcome') {
    try { if (m.token) localStorage.setItem('pa.token', m.token); } catch (_) {}
    document.documentElement.style.setProperty('--seat', m.color);
    $('seatNum').textContent = m.seat;
    $('sheetSeat').textContent = m.seat;
    $('seatName').textContent = `P${m.seat} · ${m.name}`;
    $('nameInput').value = /^Jogador \d+$/.test(m.name) ? '' : m.name;
    vibrate(60);
  } else if (m.t === 'layouts') {
    // mudou o layout ou o próprio layout foi editado no Hub: redesenha
    const before = JSON.stringify(currentLayoutObj());
    layouts = m.items && m.items.length ? m.items : FALLBACK;
    if (currentLayout !== m.current) modeIdx = 0;
    currentLayout = m.current;
    const changed = before !== JSON.stringify(currentLayoutObj());
    const l = layouts.find((x) => x.id === currentLayout);
    try { if (l) localStorage.setItem('pa.layout', JSON.stringify(l)); } catch (_) {}
    renderLayoutList();
    if (changed) render();
  } else if (m.t === 'reject') {
    const texts = { full: 'O lobby está cheio (10 de 10).', version: 'Atualize a página.', closed: 'O lobby está fechado agora.' };
    $('rejText').textContent = texts[m.reason] || m.reason;
    $('rejected').classList.add('on');
    if (m.reason === 'version') { stopped = true; setTimeout(() => location.reload(), 1500); }
  } else if (m.t === 'stats') {
    showStats(m.data);
  } else if (m.t === 'toast') {
    showToast(m.text);
  } else if (m.t === 'identify') {
    let el = $('flash');
    if (!el) { el = document.createElement('div'); el.id = 'flash'; document.body.appendChild(el); }
    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
    showToast('É você! O Hub está te procurando.');
  }
}

// aviso curto no topo (o Hub ou o jogo mandam: "Você saiu do lobby...", pa_toast do SDK)
let toastTimer = 0;
function showToast(text) {
  let el = $('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 4000);
}

function onBinary(dv) {
  const type = dv.getUint8(0);
  if (type === 0x85) { // SYNC_REPLY
    const id = dv.getUint16(1, true);
    const t0 = syncSent.get(id);
    if (t0 === undefined) return;
    syncSent.delete(id);
    const t1 = performance.now();
    const b = new DataView(new ArrayBuffer(11));
    b.setUint8(0, 0x07); b.setUint16(1, id, true); b.setFloat64(3, t1, true);
    sendRaw(b.buffer);
    rtts.push(t1 - t0);
    if (rtts.length > 30) rtts.shift();
    showNet();
  } else if (type === 0x84) { // RUMBLE
    vibrate(dv.getUint16(1, true));
  }
}

function sendRaw(buf) {
  if (ws && ws.readyState === 1) ws.send(buf);
}

function sendText(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

function sendSync() {
  syncId = (syncId + 1) & 0xffff;
  const t0 = performance.now();
  syncSent.set(syncId, t0);
  if (syncSent.size > 16) syncSent.delete(syncSent.keys().next().value);
  const b = new DataView(new ArrayBuffer(11));
  b.setUint8(0, 0x06); b.setUint16(1, syncId, true); b.setFloat64(3, t0, true);
  sendRaw(b.buffer);
}

// STATE_T: [05][seq u16][botões u16][lx][ly][rx][ry][lt][rt][tipo u8][t f64]
function sendState(kind, t) {
  const b = new DataView(new ArrayBuffer(20));
  const axis = (v) => Math.round(Math.max(-1, Math.min(1, v)) * 127);
  const trig = (v) => Math.round(Math.max(0, Math.min(1, v)) * 255);
  b.setUint8(0, 0x05);
  b.setUint16(1, seq, true);
  b.setUint16(3, pad.buttons & 0x7fff, true);
  b.setInt8(5, axis(pad.lx)); b.setInt8(6, axis(pad.ly)); b.setInt8(7, axis(pad.rx)); b.setInt8(8, axis(pad.ry));
  b.setUint8(9, trig(pad.lt)); b.setUint8(10, trig(pad.rt));
  b.setUint8(11, kind);
  b.setFloat64(12, t, true);
  sendRaw(b.buffer);
  seq = (seq + 1) & 0xffff;
  lastSend = performance.now();
}

// Instante do toque. event.timeStamp usa a mesma origem de performance.now() nos navegadores atuais;
// se vier em outra base (navegador antigo), cai para agora.
function touchTime(e) {
  const now = performance.now();
  const t = e && e.timeStamp;
  return t && t <= now + 5 && t > now - 5000 ? t : now;
}

setInterval(() => {
  if (performance.now() - lastSend >= HEARTBEAT_MS) sendState(KIND.heartbeat, performance.now());
}, 25);

// ---------------------------------------------------------------- botões e analógicos
function wire() {
  document.querySelectorAll('#pad [data-b]').forEach((el) => {
    const name = el.dataset.b;
    const set = (on, e) => {
      if (name === 'LT') pad.lt = on ? 1 : 0;
      else if (name === 'RT') pad.rt = on ? 1 : 0;
      else if (on) pad.buttons |= 1 << BIT[name];
      else pad.buttons &= ~(1 << BIT[name]);
      el.classList.toggle('down', on);
      sendState(KIND.touch, touchTime(e));
    };
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      capture(el, e);
      set(true, e);
      if (prefs.vibe) vibrate(8);
      keepAwake();
    });
    const up = (e) => { if (el.classList.contains('down')) set(false, e); };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('lostpointercapture', up);
  });
  document.querySelectorAll('#pad [data-stick]').forEach((zone) => stick(zone, zone.dataset.stick === 'l' ? ['lx', 'ly'] : ['rx', 'ry']));
}

// analógico flutuante: nasce onde o dedo toca
function stick(zone, [ax, ay]) {
  let id = null, ox = 0, oy = 0, base = null, knob = null, R = 60;
  zone.addEventListener('pointerdown', (e) => {
    if (id !== null) return;
    e.preventDefault();
    capture(zone, e);
    id = e.pointerId;
    const r = zone.getBoundingClientRect();
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    R = Math.max(40, Math.min(72, U * 0.17));
    base = document.createElement('div'); base.className = 'base';
    knob = document.createElement('div'); knob.className = 'knob';
    base.style.width = base.style.height = R * 2 + 'px';
    knob.style.width = knob.style.height = R * 0.95 + 'px';
    base.style.left = knob.style.left = ox + 'px';
    base.style.top = knob.style.top = oy + 'px';
    zone.append(base, knob);
    zone.classList.add('used');
    if (!prefs.stickSeen) { prefs.stickSeen = true; try { localStorage.setItem('pa.prefs', JSON.stringify(prefs)); } catch (_) {} }
    keepAwake();
  });
  zone.addEventListener('pointermove', (e) => {
    if (e.pointerId !== id) return;
    const r = zone.getBoundingClientRect();
    let dx = e.clientX - r.left - ox, dy = e.clientY - r.top - oy;
    const len = Math.hypot(dx, dy);
    if (len > R) { dx *= R / len; dy *= R / len; }
    knob.style.left = ox + dx + 'px';
    knob.style.top = oy + dy + 'px';
    // zona morta radial, reescalada para o eixo ainda chegar a 1
    const mag = Math.min(1, len / R);
    const k = mag < DEADZONE ? 0 : (mag - DEADZONE) / (1 - DEADZONE) / (mag || 1);
    const x = (dx / R) * k, y = (-dy / R) * k;
    if (Math.abs(x - pad[ax]) < 0.01 && Math.abs(y - pad[ay]) < 0.01) return;
    pad[ax] = x; pad[ay] = y;
    sendState(KIND.stick, touchTime(e));
  });
  const end = (e) => {
    if (e.pointerId !== id) return;
    id = null;
    base && base.remove(); knob && knob.remove();
    pad[ax] = 0; pad[ay] = 0;
    sendState(KIND.touch, touchTime(e));
  };
  zone.addEventListener('pointerup', end);
  zone.addEventListener('pointercancel', end);
}

// trocar de layout ou abrir o menu solta tudo: nenhum botão fica preso no jogo
function releaseAll() {
  pad.buttons = 0; pad.lx = pad.ly = pad.rx = pad.ry = pad.lt = pad.rt = 0;
  document.querySelectorAll('#pad .down').forEach((el) => el.classList.remove('down'));
  sendState(KIND.touch, performance.now());
}

// ---------------------------------------------------------------- menu (segurar para abrir)
const menuBtn = $('menuBtn');
let hold = null;
menuBtn.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  capture(menuBtn, e);
  const t0 = performance.now();
  menuBtn.classList.add('holding');
  const tick = () => {
    const p = Math.min(1, (performance.now() - t0) / HOLD_MS);
    menuBtn.style.setProperty('--p', p);
    if (p >= 1) { stopHold(false); openMenu(); return; }
    hold = requestAnimationFrame(tick);
  };
  hold = requestAnimationFrame(tick);
});
function stopHold(tapped) {
  cancelAnimationFrame(hold);
  hold = null;
  menuBtn.classList.remove('holding');
  menuBtn.style.setProperty('--p', 0);
  if (tapped) showToast('Segure o botão Menu para abrir');
}
menuBtn.addEventListener('pointerup', () => { if (hold) stopHold(true); });
menuBtn.addEventListener('pointercancel', () => { if (hold) stopHold(false); });

function openMenu() {
  releaseAll();
  vibrate(30);
  renderLayoutList();
  $('optVibe').classList.toggle('on', prefs.vibe);
  $('optFs').classList.toggle('on', !!document.fullscreenElement);
  $('sheet').classList.add('on');
}
$('closeMenu').addEventListener('click', () => $('sheet').classList.remove('on'));

function renderLayoutList() {
  const describe = (l) => {
    if (l.modes.length > 1) return l.modes.map((m) => m.name).join(' · ');
    const c = l.modes[0].pieces.map((p) => p.kind);
    const names = { stickL: 'analógico', stickR: '2º analógico', dpad: 'setas', LT: 'gatilhos', LB: 'ombros' };
    const parts = Object.keys(names).filter((k) => c.includes(k)).map((k) => names[k]);
    const face = ['A', 'B', 'X', 'Y'].filter((b) => c.includes(b));
    return [face.join(' '), ...parts].filter(Boolean).join(' · ');
  };
  $('layoutList').innerHTML = layouts.map((l) => `<button class="opt${l.id === currentLayout ? ' on' : ''}" data-layout="${escapeHtml(l.id)}"><span class="dot"></span><span><b>${escapeHtml(l.name)}</b><small>${escapeHtml(describe(l))}</small></span></button>`).join('');
}
$('layoutList').addEventListener('click', (e) => {
  const b = e.target.closest('[data-layout]');
  if (!b) return;
  currentLayout = b.dataset.layout;
  modeIdx = 0;
  const l = layouts.find((x) => x.id === currentLayout);
  try { if (l) localStorage.setItem('pa.layout', JSON.stringify(l)); } catch (_) {}
  renderLayoutList();
  render();
  sendText({ t: 'layout', id: currentLayout });
  vibrate(15);
});
$('nameForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('nameInput').value.trim();
  if (!name) return;
  sendText({ t: 'rename', name });
  $('seatName').textContent = $('seatName').textContent.replace(/·.*$/, `· ${name}`);
  $('nameInput').blur();
  showToast('Nome trocado');
});
$('optVibe').addEventListener('click', () => {
  prefs.vibe = !prefs.vibe;
  $('optVibe').classList.toggle('on', prefs.vibe);
  try { localStorage.setItem('pa.prefs', JSON.stringify(prefs)); } catch (_) {}
  if (prefs.vibe) vibrate(20);
});
$('optFs').addEventListener('click', () => {
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  setTimeout(() => $('optFs').classList.toggle('on', !!document.fullscreenElement), 300);
});
$('optDiag').addEventListener('click', () => {
  const on = $('diag').hidden;
  $('diag').hidden = !on;
  $('optDiag').classList.toggle('on', on);
});

// ---------------------------------------------------------------- diagnóstico
$('burstBtn').addEventListener('click', () => {
  if (burstTimer) return;
  const until = performance.now() + 30000;
  $('burstBtn').disabled = true;
  burstTimer = setInterval(() => {
    const now = performance.now();
    if (now >= until) { stopBurst(); $('burstTxt').textContent = 'Pronto.'; return; }
    sendState(KIND.burst, now);
    $('burstTxt').textContent = `Medindo... ${Math.ceil((until - now) / 1000)} s`;
  }, 16);
});
function stopBurst() {
  clearInterval(burstTimer);
  burstTimer = null;
  $('burstBtn').disabled = false;
}

const fmt = (v) => (v == null ? '--' : v < 10 ? v.toFixed(1) : Math.round(v)) + (v == null ? '' : ' ms');
function showStats(d) {
  const put = (p, s) => {
    $(p + '50').textContent = fmt(s && s.p50);
    $(p + '95').textContent = fmt(s && s.p95);
    $(p + '99').textContent = fmt(s && s.p99);
    $(p + 'n').textContent = s ? s.n : 0;
  };
  put('t', d.touch); put('r', d.burst); put('i', d.rtt);
}
function showNet() {
  const sorted = [...rtts].sort((a, b) => a - b);
  const med = sorted[Math.floor(sorted.length / 2)];
  const net = $('net');
  net.className = 'net' + (med > 60 ? ' bad' : med > 30 ? ' warn' : '');
  $('netTxt').textContent = `${Math.round(med)} ms`;
}

// ---------------------------------------------------------------- tela
let wakeLock = null;
async function keepAwake() {
  if (wakeLock || !navigator.wakeLock) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (_) {}
}
// A captura garante o "soltou" mesmo se o dedo escorregar para fora; se falhar, o botão ainda funciona.
function capture(el, e) { try { el.setPointerCapture(e.pointerId); } catch (_) {} }
// Android: Vibration API. iPhone: não tem; o Safari 18+ dá um toque de vibração ao acionar um interruptor
// (<input type=checkbox switch>), mas só durante um toque na tela. Pedidos do Hub no iPhone ficam no visual.
let hapticLabel = null;
function vibrate(ms) {
  if (navigator.vibrate) { navigator.vibrate(ms); return; }
  if (!hapticLabel) {
    hapticLabel = document.createElement('label');
    hapticLabel.id = 'haptic';
    hapticLabel.innerHTML = '<input type="checkbox" switch>';
    document.body.appendChild(hapticLabel);
  }
  hapticLabel.click();
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// iPhone: o Safari ignora user-scalable=no. Dois toques rápidos davam zoom, e sem gesto para sair dele.
// Bloqueia o toque duplo e a pinça; se mesmo assim a tela ficar com zoom, volta ao normal sozinha.
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd < 350 && !e.target.closest('input')) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
['gesturestart', 'gesturechange'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
if (window.visualViewport) {
  visualViewport.addEventListener('resize', () => {
    if (visualViewport.scale <= 1.01) return;
    const meta = document.querySelector('meta[name=viewport]');
    const content = meta.content;
    meta.content = content.replace('maximum-scale=1', 'maximum-scale=1.0001');
    setTimeout(() => { meta.content = content; }, 60);
  });
}

// Em segundo plano o celular fecha a conexão; ao voltar, reconecta (docs/ARCHITECTURE.md).
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (ws) ws.close(); }
  else if (!ws || ws.readyState > 1) connect();
});

render();
connect();
</script>
</body>
</html>
