[workspace]
resolver = "2"
members = [
    "crates/pa-cli",
    "crates/pa-core",
    "crates/pa-library",
    "crates/pa-manifest",
    "crates/pa-phone",
    "crates/pa-virtualpad",
    "spikes/latency",
]

[workspace.package]
edition = "2021"
version = "0.0.1"
publish = false

[workspace.dependencies]
pa-cli = { path = "crates/pa-cli" }
pa-core = { path = "crates/pa-core" }
pa-library = { path = "crates/pa-library" }
pa-manifest = { path = "crates/pa-manifest" }
pa-phone = { path = "crates/pa-phone" }
pa-virtualpad = { path = "crates/pa-virtualpad" }

axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
if-addrs = "0.13"
imagesize = "0.13"
png = "0.17"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
vigem-client = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
debug = 1
