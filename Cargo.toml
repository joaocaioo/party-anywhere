[workspace]
resolver = "2"
members = [
    "apps/hub/src-tauri",
    "crates/pa-cli",
    "crates/pa-core",
    "crates/pa-library",
    "crates/pa-manifest",
    "crates/pa-phone",
    "crates/pa-sdk",
    "crates/pa-virtualpad",
    "spikes/latency",
]

[workspace.package]
edition = "2021"
version = "0.1.3"
publish = false

[workspace.dependencies]
pa-cli = { path = "crates/pa-cli" }
pa-core = { path = "crates/pa-core" }
pa-library = { path = "crates/pa-library" }
pa-manifest = { path = "crates/pa-manifest" }
pa-phone = { path = "crates/pa-phone" }
pa-sdk = { path = "crates/pa-sdk" }
pa-virtualpad = { path = "crates/pa-virtualpad" }

axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.2"
if-addrs = "0.13"
imagesize = "0.13"
png = "0.17"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
vigem-client = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
debug = 1

# A tela do jogo no celular comprime JPEG a cada quadro: sem otimização (cargo run), o celular cai para ~7
# quadros por segundo. Otimizado também no modo de desenvolvimento; para medir desempenho, use o Hub release.
[profile.dev.package.jpeg-encoder]
opt-level = 3
