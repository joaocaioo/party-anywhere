[package]
name = "party-anywhere-hub"
description = "Party Anywhere: o Hub (app desktop)."
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "party-anywhere"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pa-core.workspace = true
pa-library.workspace = true
pa-manifest.workspace = true
pa-phone.workspace = true
pa-sdk.workspace = true
pa-virtualpad.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
gilrs = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile.workspace = true
